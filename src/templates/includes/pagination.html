{% if page_obj.paginator.num_pages > 1 %}
<script>
(function () {
    // Відновлюємо позицію скролу після переходу між сторінками
    var saved = sessionStorage.getItem('pager-scroll');
    if (saved !== null) {
        sessionStorage.removeItem('pager-scroll');
        requestAnimationFrame(function () {
            window.scrollTo({ top: parseInt(saved, 10), behavior: 'instant' });
        });
    }
    // Зберігаємо позицію перед переходом
    document.addEventListener('click', function (e) {
        var btn = e.target.closest('.pager-btn[href]');
        if (btn) sessionStorage.setItem('pager-scroll', window.scrollY);
    });
})();
</script>
<nav class="pager" aria-label="Пагінація">
    <div class="pager-info">
        Сторінка <strong>{{ page_obj.number }}</strong> з <strong>{{ page_obj.paginator.num_pages }}</strong>
    </div>

    <div class="pager-controls">
        {% if page_obj.has_previous %}
            <a class="pager-btn" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page=1" aria-label="Перша сторінка" title="Перша">«</a>
            <a class="pager-btn" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" aria-label="Попередня сторінка">‹ Назад</a>
        {% else %}
            <span class="pager-btn pager-btn--disabled" aria-disabled="true">«</span>
            <span class="pager-btn pager-btn--disabled" aria-disabled="true">‹ Назад</span>
        {% endif %}

        <span class="pager-current">{{ page_obj.number }}</span>

        {% if page_obj.has_next %}
            <a class="pager-btn" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.next_page_number }}" aria-label="Наступна сторінка">Далі ›</a>
            <a class="pager-btn" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.paginator.num_pages }}" aria-label="Остання сторінка" title="Остання">»</a>
        {% else %}
            <span class="pager-btn pager-btn--disabled" aria-disabled="true">Далі ›</span>
            <span class="pager-btn pager-btn--disabled" aria-disabled="true">»</span>
        {% endif %}
    </div>
</nav>
{% endif %}
