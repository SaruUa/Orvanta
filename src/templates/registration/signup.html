{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація в системі</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=larger-logo-20260503">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-card-header">
            <div class="auth-brand">
                <img src="{% static 'img/organa-logo-new.png' %}" alt="Organa" class="auth-logo">
                <p class="auth-subtitle">Система управління даними для бізнесу у сфері послуг</p>
            </div>
        </div>

        <div class="login-card-body">
            <form method="post" class="login-form app-form">
                {% csrf_token %}
                {% include 'includes/form_fields.html' with form=form %}
                <button type="submit" class="btn btn-primary login-submit">Зареєструватися</button>
            </form>

            <div class="login-footer">
                <div class="mb-2">Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a></div>
                Веб-система управління даними для бізнесу у сфері послуг
            </div>
        </div>
    </div>
</div>
</body>
</html>
