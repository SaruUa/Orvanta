{% extends 'base.html' %}

{% block title %}Зміна пароля{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-page-header">
        <h1 class="page-title">Зміна пароля</h1>
        <p class="form-page-subtitle">Оновлення пароля поточного облікового запису.</p>
        <div class="form-page-toolbar">
            <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Назад до профілю</a>
        </div>
    </div>

    <div class="card form-card">
        <div class="card-body">
            <form method="post" class="app-form">
                {% csrf_token %}
                {% include 'includes/form_fields.html' with form=form %}
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Змінити пароль</button>
                    <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
