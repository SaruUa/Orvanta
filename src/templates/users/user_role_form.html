{% extends 'base.html' %}

{% block title %}Зміна ролі користувача{% endblock %}

{% block content %}
<h1 class="mb-4">Зміна ролі користувача</h1>

<div class="mb-3">
    <a href="{% url 'user_list' %}" class="btn btn-outline-secondary">Назад до списку користувачів</a>
</div>

<div class="card">
    <div class="card-body">
        <p class="mb-3">
            <strong>Користувач:</strong> {{ user_obj.username }}
        </p>

        <form method="post">
            {% csrf_token %}
            <p class="mb-3">
                {{ form.role.label_tag }}
                {{ form.role }}
            </p>
            <button type="submit" class="btn btn-primary">Зберегти роль</button>
        </form>
    </div>
</div>
{% endblock %}
