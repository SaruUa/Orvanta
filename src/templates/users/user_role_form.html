{% extends 'base.html' %}

{% block title %}Зміна ролі користувача{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-page-header">
        <h1 class="page-title">Зміна ролі користувача</h1>
        <p class="form-page-subtitle">Користувач: <strong>{{ user_obj.username }}</strong></p>
        <div class="form-page-toolbar">
            <a href="{% url 'user_list' %}" class="btn btn-outline-secondary">Назад до списку користувачів</a>
        </div>
    </div>

    <div class="card form-card">
        <div class="card-body">
            <form method="post" class="app-form">
                {% csrf_token %}
                {% include 'includes/form_fields.html' with form=form %}
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Зберегти роль</button>
                    <a href="{% url 'user_list' %}" class="btn btn-outline-secondary">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
