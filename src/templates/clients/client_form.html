{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="mb-4">{{ title }}</h1>

<div class="mb-3">
    <a href="{% url 'client_list' %}" class="btn btn-outline-secondary">Назад до списку клієнтів</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Зберегти</button>
        </form>
    </div>
</div>
{% endblock %}
