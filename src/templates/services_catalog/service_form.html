{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-page-header">
        <h1 class="page-title">{{ title }}</h1>
        <p class="form-page-subtitle">Базова вартість, тривалість і категорія послуги.</p>
        <div class="form-page-toolbar">
            <a href="{% url 'service_list' %}" class="btn btn-outline-secondary">Назад до списку послуг</a>
        </div>
    </div>

    <div class="card form-card">
        <div class="card-body">
            <form method="post" class="app-form">
                {% csrf_token %}
                {% include 'includes/form_fields.html' with form=form %}
                <div class="form-actions">
                    <button type="submit" class="btn btn-success">Зберегти</button>
                    <a href="{% url 'service_list' %}" class="btn btn-outline-secondary">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
