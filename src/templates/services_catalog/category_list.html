<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Категорії послуг</title>
</head>
<body>
    <h1>Категорії послуг</h1>

    <p><a href="{% url 'home' %}">На головну</a></p>
    <p><a href="{% url 'category_create' %}">Додати категорію</a></p>
    <p><a href="{% url 'service_list' %}">Перейти до списку послуг</a></p>

    {% if categories %}
        <table border="1" cellpadding="8" cellspacing="0">
            <thead>
                <tr>
                    <th>Назва</th>
                    <th>Опис</th>
                    <th>Дії</th>
                </tr>
            </thead>
            <tbody>
                {% for category in categories %}
                    <tr>
                        <td>{{ category.name }}</td>
                        <td>{{ category.description|default:"—" }}</td>
                        <td>
                            <a href="{% url 'category_update' category.pk %}">Редагувати</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>Категорії ще не створено.</p>
    {% endif %}
</body>
</html>
